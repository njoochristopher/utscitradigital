<!DOCTYPE html>
<html lang="en">
  <head>

<script type="module">

  <body>
    <main class= "page">

       <canvas id="canvas"></canvas>

      <section class="workspace" aria-label="Image Analyst">

          </form>

        <div class="palette-panel">
          <h2>Color Palette</h2>
