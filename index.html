<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ef" />
    <title>christospeed's Menu</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/colorthief@3.5.0/dist/umd/color-thief.global.js" defer></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">COLOR TOOL</p>
        <h1>Identify an image color palette</h1>
        <p class="description">
          Upload an image or enter its URL to automatically identify up to six
          dominant colors and their HEX codes.
        </p>
      </header>

      <section class="workspace" aria-label="Image color analysis">
        <div class="image-panel">
          <label class="file-label" for="image-file">Upload an image from your device</label>
          <input id="image-file" type="file" accept="image/*" />
          <form id="image-url-form" class="url-form">
            <label class="file-label" for="image-url">Or enter an image URL</label>
            <div class="url-controls">
              <input
                id="image-url"
                name="image-url"
                type="url"
                inputmode="url"
                placeholder="https://example.com/image.jpg"
                autocomplete="url"
                aria-label="Image URL"
                required
              />
              <button type="submit">Load URL</button>
            </div>
          </form>
          <p id="status" class="status" role="status" aria-live="polite">
            Choose an image or enter an image URL to get started.
          </p>
          <div class="preview-frame">
            <img id="preview" alt="Preview of the selected image" />
            <span class="preview-placeholder">Your image preview will appear here.</span>
          </div>
        </div>

        <div class="palette-panel">
          <h2>Color palette</h2>
          <p class="palette-hint">Select a HEX code to copy it.</p>
          <div id="palette" class="palette" aria-label="Identified color palette"></div>
        </div>
      </section>
    </main>
  </body>
</html>
