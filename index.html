<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme color" content="#E0FFFF">
    <title>Identify Color Palette </title>
    <script src="index.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/colorthief@2.4.0/dist/color-thief.min.js"></script>
  </head>

  <body>
    <main class= "page">
      <header class= "intro">
        <h1>christospeed's Menu</h1>
        <p class="title">Mid-exam: Identify Color Palette</p>
        <p class="description"> To make an identify color palette on the draw choice with hex code color.</p>
        <form action="#">
        <input type="file" id="imgfile" />
        <input type="button" id="btnLoad" value="Load" onclick="main();" />
       </form>
       <canvas id="canvas"></canvas>
       <div id="palette"></div>
       <div id="complementary"></div>

      <section class="workspace" aria-label="Image Analyst">
        <div class="image-panel">
          <label class="file-label" for="imgfile">Choose the Image</label>
          <input id="imgfile" type="file" accept="image/*" />
          <button id="btnLoad" type="button" able>Select</button>
          <p id="status" class="status" role="status" aria-live="polite">
            Choose the image to start.
          </p>
          <div class="preview-frame">
            <img id="preview" alt="Preview image choose." />
            <span class="preview-placeholder">A preview image will appear.</span>
          </div>
        </div>

        <div class="palette-panel">
          <h2>Color Palette</h2>
          <p class="palette-hint">Click the code for copying the results of hex code color.</p>
          <div id="palette" class="palette" aria-label="Analyze Color Results"></div>
        </div>
      </section>
      <canvas id="canvas" class="analysis-canvas" aria-hidden="true"></canvas>
      </header>
    </main>
  </body>
</html>
