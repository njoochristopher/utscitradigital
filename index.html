<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme color" content="#E0FFFF">
    <title>Identify Color Palette </title>
    <script src="index.js"></script>
    <script src="https://unpkg.com/colorthief@3/dist/umd/color-thief.global.js"></script>
  </head>

  <body>
    <main class= "page">
      <header class= "intro">
        <h1>christospeed's Menu</h1>
        <p class="title">Mid-exam</p>
        <p class="eyebrow">Color Palette Identify</p>
        <p class="description"> To make an identify color palette on the draw choice with hex code color.</p>
      </header>

      <section class="workspace" aria-label="Analyze Image Color">
        <div class="image-panel">
          <form>
          <label class="file-label" for="image-file">Choose the Image</label>
          <input id="image-file" type="file" accept="image/*" />
          <button id="buttonLoad" type="button" disabled>Load <button/>
          <p id="status" class="status" role="status" aria-live="polite">Images are ready to choose from URL/path or a device.</p>
        <div class="preview-frame">
            <img id="preview" alt="Preview image selected" />
            <span class="preview-placeholder">Your preview image will be appear here.</span>
        </div>
      
        <div class="palette-panel">
          <h2>Color Palette</h2>
          <p class="palette-hint">Select a HEX Code to copy.</p>
          <div id="palette" class="palette" aria-label="Extracting Color Palette"></div>
        </div>
      </section>
    </main>
  </body>
</html>
